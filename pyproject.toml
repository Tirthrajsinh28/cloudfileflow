[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cloudfileflow"
version = "0.1.0"
description = "Secure event-driven file ingestion portfolio project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "PyJWT==2.13.0",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "SQLAlchemy==2.0.51",
  "uvicorn==0.49.0",
]

[project.scripts]
cloudfileflow-worker = "cloudfileflow.worker_cli:main"
cloudfileflow-worker-daemon = "cloudfileflow.worker_daemon:main"

[project.optional-dependencies]
dev = [
  "coverage==7.15.0",
  "httpx2==2.5.0",
  "mypy==2.1.0",
  "pip-audit==2.10.1",
  "pip-tools==7.5.3",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudfileflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["cloudfileflow"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
