name: CloudFileFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloudfileflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFILEFLOW_DATABASE_URL: sqlite:////tmp/cloudfileflow-ci.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --require-hashes --requirement requirements-build.lock
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Run formatting, lint, and strict type gates
        run: |
          ruff format --check .
          ruff check .
          mypy

      - name: Run tests and coverage gate
        run: |
          coverage erase
          coverage run -m pytest
          coverage report --fail-under=80

      - name: Verify empty-database migration and model drift
        run: |
          alembic upgrade head
          alembic check
          alembic current

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Audit dependencies
        run: pip-audit --skip-editable

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFILEFLOW_JWT_SECRET: ci-only-synthetic-secret-32-characters
      CLOUDFILEFLOW_OPERATOR_OWNER_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag cloudfileflow:${{ github.sha }} .

      - name: Start hardened local topology
        run: docker compose up --build --wait

      - name: Verify container health
        run: curl --fail --silent --show-error http://127.0.0.1:8085/health

      - name: Inspect service state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop topology and delete synthetic data
        if: always()
        run: docker compose down --volumes --remove-orphans
